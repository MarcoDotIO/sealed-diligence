<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sealed Diligence demo stage</title>
<style>
  @font-face { font-family: "Archivo"; src: url("archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  :root { --paper:#e8ebee; --sheet:#f6f7f8; --ink:#1e2128; --muted:#5b6270; --rule:#c8cdd4; --cobalt:#2443c9; --void:#cc2a2f; --pass:#1d7a4c; --graphite:#23262d; --term-text:#e6e8ec; --term-muted:#8d95a3; --term-ok:#5fd39b; --term-bad:#ff7b7f; --term-hi:#9fb1ff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "Archivo", sans-serif; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .brand { position: absolute; top: 38px; left: 64px; display: flex; align-items: center; gap: 14px; font-stretch: 125%; font-weight: 760; font-size: 24px; }
  .brand img { width: 40px; height: 40px; }
  .step { position: absolute; top: 40px; right: 64px; display: flex; align-items: baseline; gap: 14px; font-size: 24px; color: var(--muted); }
  .step b { font-stretch: 125%; font-weight: 800; font-size: 34px; color: var(--cobalt); }

  .title { position: absolute; left: 140px; right: 140px; top: 170px; }
  .title h1 { font-stretch: 125%; font-weight: 800; font-size: 104px; line-height: 0.98; letter-spacing: -0.03em; max-width: 15ch; }
  .title p { margin-top: 30px; font-size: 34px; color: var(--muted); max-width: 46ch; }
  .facts { position: absolute; left: 140px; right: 140px; bottom: 120px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px; border-top: 3px solid var(--ink); padding-top: 26px; }
  .facts b { display: block; font-stretch: 112%; font-weight: 760; font-size: 30px; margin-bottom: 8px; }
  .facts span { font-size: 25px; color: var(--muted); line-height: 1.35; }

  .tape { position: absolute; left: -80px; right: -80px; height: 92px; transform: rotate(-2.2deg); background: var(--cobalt); color: var(--sheet); display: flex; align-items: center; white-space: nowrap; overflow: hidden; box-shadow: 0 16px 30px -18px rgba(0,0,0,.5); }
  .tape::before, .tape::after { content: ""; position: absolute; left: 0; right: 0; height: 4px; background: repeating-linear-gradient(90deg, var(--sheet) 0 20px, transparent 20px 36px); opacity: .55; }
  .tape::before { top: 9px; } .tape::after { bottom: 9px; }
  .tape span { font-stretch: 125%; font-weight: 800; font-size: 30px; letter-spacing: .06em; text-transform: uppercase; padding-left: 40px; }

  .window { position: absolute; left: 140px; top: 120px; width: 1640px; height: 770px; border-radius: 10px; overflow: hidden; box-shadow: 0 30px 80px -30px rgba(20,24,32,.55), 0 0 0 1px rgba(30,33,40,.12); }
  .terminal { background: var(--graphite); }
  .browser { background: var(--sheet); }
  .bar { height: 46px; display: flex; align-items: center; padding: 0 18px; gap: 8px; font-size: 17px; }
  .terminal .bar { color: var(--term-muted); border-bottom: 1px solid #343842; }
  .browser .bar { color: var(--muted); border-bottom: 1px solid var(--rule); background: #eef0f2; }
  .bar i { width: 13px; height: 13px; border-radius: 50%; background: #50555f; display: inline-block; }
  .browser .bar i { background: #c3c8cf; }
  .bar span { margin-left: 14px; }
  .url { flex: 1; margin-left: 18px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; height: 30px; display: flex; align-items: center; padding: 0 12px; }
  .term { padding: 26px 34px; color: var(--term-text); font: 27px/1.45 "SF Mono", ui-monospace, Menlo, monospace; white-space: pre; }
  .term .cmd::before { content: "$ "; color: var(--term-ok); }
  .ok { color: var(--term-ok); } .bad { color: var(--term-bad); } .dim { color: var(--term-muted); } .hi { color: var(--term-hi); }
  .cursor { display: inline-block; width: 13px; height: 27px; background: var(--term-text); vertical-align: -4px; }
  .shot { position: absolute; left: 0; right: 0; top: 46px; bottom: 0; overflow: hidden; }
  .shot img { position: absolute; left: 0; width: 100%; }

  .caption { position: absolute; left: 140px; bottom: 50px; max-width: 1640px; font-size: 32px; line-height: 1.3; font-weight: 500; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// window.TIMELINE is injected by make-video.ts; window.render(t) draws the frame at time t (seconds).
const FADE = 0.45;
const CHARS_PER_SECOND = 40;
const AFTER_COMMAND = 0.35;
const SHOT_VIEW_HEIGHT = 724;
const WINDOW_WIDTH = 1640;
const TAPE_REPEATS = 6;
const root = document.getElementById("root");
const built = [];

const escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);

function lineClass(text) {
  if (/NOT VERIFIED|^\s*✗|do_not_proceed|AI CODE REVIEWER|Ignore previous|_live_/.test(text)) return "bad";
  if (/^\s*✓|VERIFIED$|"Fulfilled"/.test(text)) return "ok";
  if (/^https:|EVENT_JSON|enclave attested/.test(text)) return "hi";
  if (/^\s*\[\d+\/\d+\]|^commit |^\s*sealed$|^wrote /.test(text)) return "dim";
  return "";
}

function tape(scene) {
  if (!scene.tape) return "";
  const text = Array(TAPE_REPEATS).fill(escapeHtml(scene.tape)).join("  ◆  ");
  return `<div class="tape" style="top:${scene.tapeTop ?? 640}px"><span>${text}</span></div>`;
}

function chrome(scene) {
  const brand = `<div class="brand"><img src="mark.svg" alt="">Sealed Diligence</div>`;
  const step = scene.step ? `<div class="step"><b>${scene.step[0]}</b>${escapeHtml(scene.step[1])}</div>` : "";
  return brand + step;
}

function windowHtml(scene) {
  if (scene.type === "terminal") {
    return `<div class="window terminal"><div class="bar"><i></i><i></i><i></i><span>${escapeHtml(scene.windowTitle ?? "terminal")}</span></div><div class="term"></div></div>`;
  }
  return `<div class="window browser"><div class="bar"><i></i><i></i><i></i><div class="url">${escapeHtml(scene.url)}</div></div><div class="shot"><img src="${scene.image}"></div></div>`;
}

function titleHtml(scene) {
  const sub = scene.sub ? `<p>${scene.sub}</p>` : "";
  const facts = scene.facts ? `<div class="facts">${scene.facts.map(([k, v]) => `<div><b>${k}</b><span>${v}</span></div>`).join("")}</div>` : "";
  return `<div class="title"><h1>${scene.html}</h1>${sub}</div>${tape(scene)}${facts}`;
}

function build(scene) {
  const el = document.createElement("div");
  el.className = "scene";
  const body = scene.type === "title" ? (scene.brand ? chrome({}) : "") + titleHtml(scene) : chrome(scene) + windowHtml(scene);
  el.innerHTML = body + (scene.caption ? `<div class="caption">${scene.caption}</div>` : "");
  root.appendChild(el);
  return el;
}

/** Commands type out; output lines appear one after another. */
function terminalAt(scene, local) {
  let clock = 0.3;
  const out = [];
  for (const line of scene.lines) {
    if (clock > local) break;
    if (line.startsWith("$ ")) {
      const text = line.slice(2);
      const typed = Math.floor((local - clock) * CHARS_PER_SECOND);
      const cursor = typed < text.length ? '<span class="cursor"></span>' : "";
      out.push(`<span class="cmd">${escapeHtml(text.slice(0, typed))}</span>${cursor}`);
      clock += text.length / CHARS_PER_SECOND + AFTER_COMMAND;
    } else {
      out.push(`<span class="${lineClass(line)}">${escapeHtml(line)}</span>`);
      clock += scene.lineGap ?? 0.09;
    }
  }
  return out.slice(-(scene.maxLines ?? 15)).join("\n");
}

function panShot(el, scene, local) {
  const img = el.querySelector(".shot img");
  const progress = ease(clamp01((local - (scene.panStart ?? 1)) / (scene.panDur ?? 4)));
  const maxShift = Math.max(0, img.naturalHeight * (WINDOW_WIDTH / img.naturalWidth) - SHOT_VIEW_HEIGHT);
  const from = Math.min(maxShift, scene.panFrom ?? 0);
  const to = Math.min(maxShift, scene.panPx ?? maxShift);
  img.style.top = `${-(from + progress * (to - from))}px`;
}

window.render = (t) => {
  window.TIMELINE.forEach((scene, i) => {
    const el = (built[i] ??= build(scene));
    const local = t - scene.start;
    const visible = local >= -FADE && local <= scene.dur;
    el.style.opacity = visible ? String(Math.min(clamp01(local / FADE + 1), clamp01((scene.dur - local) / FADE))) : "0";
    if (!visible) return;
    if (scene.type === "terminal") el.querySelector(".term").innerHTML = terminalAt(scene, Math.max(0, local));
    if (scene.type === "shot") panShot(el, scene, local);
    const t2 = el.querySelector(".tape");
    if (t2) t2.style.clipPath = `inset(0 ${100 - 100 * ease(clamp01((local - (scene.tapeAt ?? 0.6)) / 0.7))}% 0 0)`;
  });
};

window.imagesReady = () => Promise.all([...document.images].map((img) => (img.complete ? null : new Promise((r) => (img.onload = r)))));
</script>
</body>
</html>
