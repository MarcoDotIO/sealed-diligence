<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sealed Diligence demo stage</title>
<style>
  :root { --bg:#0b0d10; --panel:#14171c; --line:#262b33; --text:#e8eaed; --muted:#8b949e; --good:#3ecf8e; --bad:#ff5d5d; --warn:#f5b84a; --accent:#7aa2ff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; color: var(--text); font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
  body { background: radial-gradient(1200px 700px at 20% 10%, #18202e 0%, transparent 60%), radial-gradient(900px 600px at 90% 100%, #1b1726 0%, transparent 60%), var(--bg); }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .brand { position: absolute; top: 40px; left: 56px; font-size: 22px; letter-spacing: .02em; color: var(--muted); }
  .brand b { color: var(--text); font-weight: 600; }
  .step { position: absolute; top: 40px; right: 56px; font-size: 22px; color: var(--muted); }
  .title { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 200px; }
  .title h1 { font-size: 76px; line-height: 1.12; font-weight: 700; letter-spacing: -0.02em; }
  .title p { margin-top: 28px; font-size: 32px; color: var(--muted); }
  .accent { color: var(--accent); }
  .window { position: absolute; left: 160px; top: 110px; width: 1600px; height: 770px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.55); }
  .bar { height: 44px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 18px; gap: 8px; color: var(--muted); font-size: 16px; }
  .bar i { width: 13px; height: 13px; border-radius: 50%; background: #3a3f47; display: inline-block; }
  .bar span { margin-left: 14px; }
  .url { flex: 1; margin-left: 18px; background: #0d1014; border: 1px solid var(--line); border-radius: 8px; height: 28px; display: flex; align-items: center; padding: 0 12px; font-size: 15px; color: var(--muted); }
  .term { padding: 26px 34px; font: 27px/1.45 "SF Mono", ui-monospace, Menlo, monospace; white-space: pre; }
  .term .cmd { color: #fff; } .term .cmd::before { content: "$ "; color: var(--good); }
  .ok { color: var(--good); } .bad { color: var(--bad); } .dim { color: var(--muted); } .hi { color: var(--warn); }
  .cursor { display: inline-block; width: 13px; height: 26px; background: #fff; vertical-align: -4px; }
  .shot { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; overflow: hidden; }
  .shot img { position: absolute; left: 0; width: 100%; }
  .caption { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); width: max-content; max-width: 1560px; text-align: center; font-size: 33px; line-height: 1.35; padding: 12px 28px; background: rgba(8,10,13,.86); border-radius: 12px; }
  .points { margin-top: 48px; display: flex; gap: 28px; }
  .points div { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 22px 28px; font-size: 26px; text-align: left; width: 460px; line-height: 1.35; }
  .points b { display: block; color: var(--accent); font-size: 19px; margin-bottom: 10px; letter-spacing: .06em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// window.TIMELINE is injected by make-video.ts; window.render(t) draws the frame at time t (seconds).
const FADE = 0.45;
const CHARS_PER_SECOND = 40;
const AFTER_COMMAND = 0.35;
const SHOT_VIEW_HEIGHT = 726;
const root = document.getElementById("root");
const built = [];

const escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);

function lineClass(text) {
  if (/NOT VERIFIED|^\s*✗|do_not_proceed|AI CODE REVIEWER|Ignore previous|_live_/.test(text)) return "bad";
  if (/^\s*✓|VERIFIED$|"Fulfilled"/.test(text)) return "ok";
  if (/^https:|EVENT_JSON|enclave attested/.test(text)) return "hi";
  if (/^\s*\[\d+\/\d+\]|^commit |^\s*sealed$|^wrote /.test(text)) return "dim";
  return "";
}

function windowFrame(scene, inner) {
  const head = scene.url
    ? `<div class="bar"><i></i><i></i><i></i><div class="url">${escapeHtml(scene.url)}</div></div>`
    : `<div class="bar"><i></i><i></i><i></i><span>${escapeHtml(scene.windowTitle ?? "terminal")}</span></div>`;
  return `<div class="window">${head}${inner}</div>`;
}

function titleHtml(scene) {
  const sub = scene.sub ? `<p>${scene.sub}</p>` : "";
  const points = scene.points
    ? `<div class="points">${scene.points.map(([k, v]) => `<div><b>${k}</b>${v}</div>`).join("")}</div>`
    : "";
  return `<div class="title"><h1>${scene.html}</h1>${sub}${points}</div>`;
}

function build(scene) {
  const el = document.createElement("div");
  el.className = "scene";
  const brand = `<div class="brand"><b>Sealed Diligence</b> · NEAR HACKATHON</div>${scene.step ? `<div class="step">${scene.step}</div>` : ""}`;
  const body = {
    title: () => titleHtml(scene),
    terminal: () => brand + windowFrame(scene, `<div class="term"></div>`),
    shot: () => brand + windowFrame(scene, `<div class="shot"><img src="${scene.image}"></div>`),
  }[scene.type]();
  el.innerHTML = body + (scene.caption ? `<div class="caption">${scene.caption}</div>` : "");
  root.appendChild(el);
  return el;
}

/** Commands type out; output lines appear one after another. */
function terminalAt(scene, local) {
  let clock = 0.3;
  const out = [];
  for (const line of scene.lines) {
    if (clock > local) break;
    if (line.startsWith("$ ")) {
      const text = line.slice(2);
      const typed = Math.floor((local - clock) * CHARS_PER_SECOND);
      const cursor = typed < text.length ? '<span class="cursor"></span>' : "";
      out.push(`<span class="cmd">${escapeHtml(text.slice(0, typed))}</span>${cursor}`);
      clock += text.length / CHARS_PER_SECOND + AFTER_COMMAND;
    } else {
      out.push(`<span class="${lineClass(line)}">${escapeHtml(line)}</span>`);
      clock += scene.lineGap ?? 0.09;
    }
  }
  return out.slice(-(scene.maxLines ?? 15)).join("\n");
}

function panShot(el, scene, local) {
  const img = el.querySelector(".shot img");
  const progress = ease(clamp01((local - (scene.panStart ?? 1)) / (scene.panDur ?? 4)));
  const maxShift = Math.max(0, img.naturalHeight * (1600 / img.naturalWidth) - SHOT_VIEW_HEIGHT);
  img.style.top = `${-progress * Math.min(maxShift, scene.panPx ?? maxShift)}px`;
}

window.render = (t) => {
  window.TIMELINE.forEach((scene, i) => {
    const el = (built[i] ??= build(scene));
    const local = t - scene.start;
    const visible = local >= -FADE && local <= scene.dur;
    el.style.opacity = visible ? String(Math.min(clamp01(local / FADE + 1), clamp01((scene.dur - local) / FADE))) : "0";
    if (!visible) return;
    if (scene.type === "terminal") el.querySelector(".term").innerHTML = terminalAt(scene, Math.max(0, local));
    if (scene.type === "shot") panShot(el, scene, local);
  });
};

window.imagesReady = () => Promise.all([...document.images].map((img) => (img.complete ? null : new Promise((r) => (img.onload = r)))));
</script>
</body>
</html>
