[package]
name = "sealed-diligence-escrow"
version = "0.1.0"
edition = "2021"
description = "Escrow that pays for a sealed diligence report only when a NEAR AI enclave signed it for the requested commit."
license = "MIT"
repository = "https://github.com/MarcoDotIO/sealed-diligence"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
hex = "0.4"
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
